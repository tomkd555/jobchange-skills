name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: エージェント定義の同期確認
        run: |
          [ "$(ls agents/job-change-*.md | wc -l)" -eq "$(ls skills/*/references/roles/*.md | wc -l)" ] || { echo "agents/ と references/roles/ の数が違う"; exit 1; }
          for f in skills/*/references/roles/*.md; do
            a="agents/job-change-$(basename "$f")"
            cmp "$a" "$f" || { echo "不一致: $a と $f"; exit 1; }
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 単体テスト
        run: |
          for d in skills/*/; do
            if [ -d "$d/scripts/tests" ]; then
              (cd "$d" && python -m unittest discover -s scripts/tests -q)
            fi
          done
